query ScheduledOrders($who: String!) {
  events(
    where: {
      args_jsonContains: { who: $who }
      AND: { name_eq: "DCA.Scheduled" }
    }
    orderBy: [block_height_DESC]
    limit: 100
  ) {
    name
    args
    call {
      args
    }
    block {
      height
      hash
      timestamp
    }
  }
}

query OrdersStatus($who: String!) {
  events(
    where: {
      args_jsonContains: { who: $who }
      AND: {
        name_in: ["DCA.Terminated", "DCA.Completed", "DCA.MigrationCancelled"]
      }
    }
    orderBy: [block_height_DESC]
    limit: 100
  ) {
    name
    args
  }
}

query MigratedOrders($who: String!) {
  events(
    where: {
      args_jsonContains: { who: $who }
      AND: { name_eq: "DCA.Migrated" }
    }
    orderBy: [block_height_DESC]
    limit: 100
  ) {
    name
    args
    block {
      height
      hash
      timestamp
    }
  }
}

query OrderTrades($id: Int!) {
  events(
    where: {
      args_jsonContains: { id: $id }
      AND: { name_in: ["DCA.TradeExecuted", "DCA.TradeFailed"] }
    }
    orderBy: [block_height_DESC]
    limit: 100
  ) {
    name
    args
    block {
      height
      timestamp
    }
  }
}

query IntentsSubmitted($owner: String!, $limit: Int!, $offset: Int!) {
  events(
    where: {
      args_jsonContains: { owner: $owner }
      AND: { name_eq: "Intent.IntentSubmitted" }
    }
    orderBy: [block_height_DESC]
    limit: $limit
    offset: $offset
  ) {
    name
    args
    block {
      height
      hash
      timestamp
    }
  }
}

query IntentEvents($idFilters: [EventWhereInput!]!) {
  events(
    where: {
      AND: [
        {
          name_in: [
            "Intent.IntentResolved"
            "Intent.IntentResovedPartially"
            "Intent.IntentCanceled"
            "Intent.IntentExpired"
            "Intent.DcaTradeExecuted"
            "Intent.DcaCompleted"
          ]
        }
        { OR: $idFilters }
      ]
    }
    orderBy: [block_height_DESC]
    limit: 1000
  ) {
    name
    args
    block {
      height
      hash
      timestamp
    }
  }
}
